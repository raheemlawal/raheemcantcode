[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next 16 needs >= 20.9; Netlify's default image may still be on 18.
  NODE_VERSION = "20"

# Declared explicitly rather than relying on Netlify's auto-detection: this site
# predates the Next.js Runtime, and without the plugin Netlify serves .next as a
# static directory, which 404s on every route.
[[plugins]]
  package = "@netlify/plugin-nextjs"
